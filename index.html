<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Авторы сериала</title>
<style>
:root{
  --bg:#150f22;--panel:#1f1733;--panel2:#271d40;--text:#efe9fb;--muted:#a597c4;--line:#352850;
  --accent:#c77dff;--accent2:#ff6fb5;--soft:rgba(199,125,255,.14);--hover:rgba(255,111,181,.10);
}
:root[data-theme=light]{
  --bg:#faf5ff;--panel:#fff;--panel2:#f6ecff;--text:#2a1740;--muted:#7d6a99;--line:#ead9fb;
  --accent:#9333ea;--accent2:#db2777;--soft:rgba(147,51,234,.10);--hover:rgba(219,39,119,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(900px 400px at 85% -10%,rgba(255,111,181,.13),transparent),radial-gradient(800px 400px at 0% -10%,rgba(199,125,255,.15),transparent);background-attachment:fixed}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{color:var(--muted);font-size:13px;flex:1;min-width:140px}
.tabs{display:flex;gap:4px;background:var(--panel);padding:3px;border-radius:11px;border:1px solid var(--line)}
.tabs button{border:0;background:none;color:var(--muted);padding:6px 16px;border-radius:8px;font:inherit;cursor:pointer}
.tabs button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:6px 11px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--accent)}
.tools{max-width:980px;margin:0 auto;padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:200px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
main{max-width:980px;margin:0 auto;padding:16px 16px 70px}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:6px 0}
details details{background:var(--panel2);border-radius:10px}
details details details{background:var(--panel)}
summary{cursor:pointer;padding:9px 14px;display:flex;align-items:center;gap:10px;list-style:none;border-radius:inherit}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--accent2);transition:transform .15s;flex:none}
details[open]>summary::before{transform:rotate(90deg)}
summary:hover{background:var(--hover)}
summary .t{flex:1;min-width:0}
details.l1>summary{font-weight:600}
.body{padding:2px 10px 10px 22px}
.badge{background:var(--soft);color:var(--accent);border-radius:99px;padding:1px 10px;font-size:12px;white-space:nowrap}
.num{color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums;margin-right:8px}
.role{color:var(--muted);font-weight:400}
.leaf{display:flex;gap:8px;padding:5px 12px;border-radius:8px}
.leaf:hover{background:var(--hover)}
.leaf.link{cursor:pointer}
.leaf.link:hover .t2{color:var(--accent2)}
.names{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px}
.pill{background:var(--soft);border-radius:99px;padding:2px 12px;cursor:pointer}
.pill:hover{background:var(--accent);color:#fff}
.empty{text-align:center;color:var(--muted);padding:50px 0}
mark{background:var(--accent2);color:#fff;border-radius:3px;padding:0 2px}
.flash{animation:fl 1.6s}
@keyframes fl{0%,60%{box-shadow:0 0 0 2px var(--accent2)}100%{box-shadow:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>🌀 Авторы сериала</h1>
    <div class="stats" id="stats">Загрузка…</div>
    <div class="tabs" id="tabs"><button data-p="authors" class="on">Авторы</button><button data-p="eps">Серии</button></div>
    <button class="btn" id="theme" title="Сменить тему">🌓</button>
  </div>
  <div class="tools">
    <input type="search" id="q" placeholder="Поиск…" autocomplete="off">
    <button class="btn" id="open">Развернуть всё</button>
    <button class="btn" id="close">Свернуть всё</button>
  </div>
</header>
<main id="main"></main>

<script>
const DATA_URL = 'authors_data.json';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural = (n,f) => { const a=n%100,b=n%10; return n+' '+(a>10&&a<15?f[2]:b==1?f[0]:b>1&&b<5?f[1]:f[2]); };
const cmp = (a,b) => a.localeCompare(b,'ru',{numeric:true});
const A = ['автор','автора','авторов'], E = ['серия','серии','серий'];

let DATA, EPS = {}, page = 'authors', q = '';
// EPS: series -> num -> {title, roles:{role:[authors]}}

const hl = t => {
  t = esc(t); if (!q) return t;
  const i = t.toLowerCase().indexOf(esc(q).toLowerCase());
  return i < 0 ? t : t.slice(0,i)+'<mark>'+t.slice(i,i+esc(q).length)+'</mark>'+t.slice(i+esc(q).length);
};
const has = t => t.toLowerCase().includes(q);

async function init() {
  try { DATA = await (await fetch(DATA_URL)).json(); }
  catch { $('#main').innerHTML = '<div class="empty">Не удалось загрузить <code>'+DATA_URL+'</code>.<br>Откройте страницу через сервер (github.io), а не через file://</div>'; $('#stats').textContent='Ошибка загрузки'; return; }
  for (const [name, roles] of Object.entries(DATA))
    for (const [role, series] of Object.entries(roles))
      for (const [s, eps] of Object.entries(series))
        for (const [n, title] of Object.entries(eps)) {
          const e = ((EPS[s] ||= {})[n] ||= {title, roles:{}});
